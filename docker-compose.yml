version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sangamsetu_db
    environment:
      POSTGRES_DB: sangamsetu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass@123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sangamsetu-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sangamsetu_backend
    command: sh -c "python manage.py migrate && gunicorn --bind 0.0.0.0:8000 --workers 3 sangamsetu.wsgi:application"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-change-in-production}
      - DATABASE_NAME=sangamsetu
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-pass@123}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:80}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sangamsetu-network

  frontend:
    build:
      context: ./sangamsetu-frontend
      dockerfile: Dockerfile
    container_name: sangamsetu_frontend
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_BASE_URL=${REACT_APP_API_BASE_URL:-http://localhost:8000/api}
    depends_on:
      - backend
    networks:
      - sangamsetu-network

volumes:
  postgres_data:

networks:
  sangamsetu-network:
    driver: bridge

